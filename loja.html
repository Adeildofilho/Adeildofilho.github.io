
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vitrine Online</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

    <!-- Faixa de aviso -->
    <div class="bg-dark text-white text-center py-2">
        Frete grátis nas compras acima de R$ 199!
    </div>

    <!-- Menu de navegação -->
    <nav class="navbar navbar-expand-lg bg-white shadow-sm">
        <div class="container">

            <a class="navbar-brand fw-bold text-primary" href="#">
                Vitrine Online
            </a>

            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menu">

                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="#">Início</a>
                    </li>

                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#categorias"
                           role="button" data-bs-toggle="dropdown">
                            Categorias
                        </a>

                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#categorias">Eletrônicos</a></li>
                            <li><a class="dropdown-item" href="#categorias">Moda</a></li>
                            <li><a class="dropdown-item" href="#categorias">Casa</a></li>
                        </ul>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#produtos">Ofertas</a>
                    </li>
                </ul>

                <form class="d-flex gap-2" role="search">
                    <input class="form-control" type="search"
                           placeholder="Buscar produtos..."
                           aria-label="Buscar produtos">

                    <button class="btn btn-primary" type="submit">
                        Buscar
                    </button>
                </form>

                <a href="#produtos" class="btn btn-outline-primary ms-lg-3 mt-2 mt-lg-0">
                    Carrinho <span class="badge text-bg-secondary">0</span>
                </a>

            </div>
        </div>
    </nav>

  
    <!-- Carrossel principal -->
    <section class="container my-4">

        <div id="carrosselPrincipal"
             class="carousel slide"
             data-bs-ride="carousel">

            <!-- Indicadores dos slides -->
            <div class="carousel-indicators">
                <button type="button"
                        data-bs-target="#carrosselPrincipal"
                        data-bs-slide-to="0"
                        class="active"
                        aria-label="Slide 1"></button>

                <button type="button"
                        data-bs-target="#carrosselPrincipal"
                        data-bs-slide-to="1"
                        aria-label="Slide 2"></button>

                <button type="button"
                        data-bs-target="#carrosselPrincipal"
                        data-bs-slide-to="2"
                        aria-label="Slide 3"></button>
            </div>

            <!-- Imagens -->
            <div class="carousel-inner rounded">

                <div class="carousel-item active">
                    <img src="https://placehold.co/1200x400/0d6efd/ffffff?text=Grandes+Ofertas"
                         class="d-block w-100"
                         alt="Grandes ofertas da loja">
                </div>

                <div class="carousel-item">
                    <img src="https://placehold.co/1200x400/198754/ffffff?text=Novidades"
                         class="d-block w-100"
                         alt="Novidades da loja">
                </div>

                <div class="carousel-item">
                    <img src="https://placehold.co/1200x400/6f42c1/ffffff?text=Descontos+Especiais"
                         class="d-block w-100"
                         alt="Descontos especiais">
                </div>

            </div>

            <!-- Botão anterior -->
            <button class="carousel-control-prev"
                    type="button"
                    data-bs-target="#carrosselPrincipal"
                    data-bs-slide="prev">

                <span class="carousel-control-prev-icon"
                      aria-hidden="true"></span>

                <span class="visually-hidden">Anterior</span>
            </button>

            <!-- Botão próximo -->
            <button class="carousel-control-next"
                    type="button"
                    data-bs-target="#carrosselPrincipal"
                    data-bs-slide="next">

                <span class="carousel-control-next-icon"
                      aria-hidden="true"></span>

                <span class="visually-hidden">Próximo</span>
            </button>

        </div>
    </section>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
